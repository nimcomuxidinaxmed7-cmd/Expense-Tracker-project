<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currency Converter</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>

      <h1>Currency Converter</h1>
      <div>
        <label for="homeCurrency">Home Currency:</label>
        <select id="homeCurrency" name="homeCurrency" required>
            <option value="" disabled selected>Select home currency</option>
            <option value="USD">USD</option>
            <option value="EUR">EUR</option>
            <option value="KES">KES</option>
            <option value="GBP">GBP</option>
            <option value="INR">INR (₹)</option>
            <option value="JPY">JPY (¥)</option>
        </select>
      </div>
     <section>
       <h2>Add Entry</h2>
       <form id="entryForm">
        <!-- Description -->
        <div>
            <label for="description">Description</label>
            <input type="text" id="description" name="description" placeholder="e.g., Grocery shopping" required/>
        </div>

        <!--Amount -->
        <div>
         <label for="amount">Amount</label>
         <input type="number" id="number" name="amount" placeholder="0.00" min="0.01" step="0.01" required/>
        </div>
    <!-- Currency-->
         <div>
         <label for="currency">Currency</label>
           <!--Dropdown menu-->
         <select id="currency" name="currency">
             <option value="USD">USD ($)</option>
             <option value="EUR">EUR (€)</option>
             <option value="GBP">GBP (£)</option>
             <option value="INR">INR (₹)</option>
             <option value="JPY">JPY (¥)</option>
             <option value="KES">KES</option>
         </select>
        </div>

        <!--Category-->
        <div>
         <label for="category">Category</label>
         <select id="category" name="category">
             <option value="" disabled selected>Select a Category</option>
             <option value="transport">Transport</option>
             <option value="food">Food & Dining</option>
             <option value="shopping">Shopping</option>
             <option value="utilities">Bills & Utilities</option>
             <option value="entertainment">Entertainment</option>
             <option value="other">Other</option>
         </select>
        </div>
     <button type="submit">Add</button>
      </form>
    


     <div id="expensesContainer"></div>
 
     <p>Total: <span id="totalAmount">0.00</span></p>

    </section>
 
    <footer>
      <a href="https://www.exchangerate-api.com">Rates By Exchange Rate API</a>
    </footer>
 
    <script src="main.js"></script>

  </body>
</html>
