<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Currency Converter</title>
  </head>
  <body>

      <h1>Currency Converter</h1>
      <div>
        <label for="homeCurrency">Home Currency:</label>
        <select id="homeCurrency" name="homeCurrency" required>
            <option value="" disabled selected>Select home currency</option>
            <option value="USD">USD</option>
            <option value="EUR">EUR</option>
            <option value="KES">KES</option>
            <option value="GBP">GBP</option>
            <option value="INR">INR (₹)</option>
            <option value="JPY">JPY (¥)</option>
        </select>
      </div>
     <section>
       <h2>Add Entry</h2>
       <form id="entryForm">
        <!-- Description -->
        <div>
            <label for="description">Description</label>
            <input type="text" id="description" name="description" placeholder="e.g., Grocery shopping" required/>
        </div>

        <!--Amount -->
        <div>
         <label for="amount">Amount</label>
         <input type="number" id="number" name="amount" placeholder="0.00" min="0.01" step="0.01" required/>
        </div>
